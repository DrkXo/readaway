  markdown: ^7.3.1
  diacritic: ^0.1.6
  jsonc: ^0.0.3
  vscode_theme_parser: ^1.2.0-dev.0
  pdfrx: ^2.6.0
  image: ^4.10.1

dev_dependencies:
