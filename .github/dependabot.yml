version: 2
updates:
  # Keep GitHub Actions (including gradle/actions) on Node 24 runtimes and
  # ahead of deprecation windows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dart/Flutter workspace members. The hyper_render fork is resolved as a git
  # dependency (see dependency_overrides in the root pubspec.yaml) and is
  # intentionally not listed here.
  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/apps/readaway"
      - "/packages/readaway_core"
      - "/packages/vscode_theme_parser"
    schedule:
      interval: "weekly"
    groups:
      pub:
        patterns:
          - "*"

  # Gradle build for the Android app (wrapper + Android Gradle Plugin).
  - package-ecosystem: "gradle"
    directory: "/apps/readaway/android"
    schedule:
      interval: "weekly"
    groups:
      gradle:
        patterns:
          - "*"
