# Dependabot Configuration
version: 2
updates:
  # Monitor GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 10

  # Monitor Root Dart / Melos Workspace dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  # Monitor ReadAway App dependencies
  - package-ecosystem: "pub"
    directory: "/apps/readaway"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  # Monitor ReadAway Core package dependencies
  - package-ecosystem: "pub"
    directory: "/packages/readaway_core"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  # Monitor VS Code Theme Parser package dependencies
  - package-ecosystem: "pub"
    directory: "/packages/vscode_theme_parser"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
