name: Feature Request
description: Propose a new feature, idea, or enhancement for ReadAway
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate suggestions and feature requests! Please describe your proposal clearly so the community can evaluate and discuss it.

  - type: input
    id: summary
    attributes:
      label: Feature Summary
      description: A concise title or summary of the proposed feature.
      placeholder: e.g., Add OPDS catalog support for remote library syncing
    validations:
      required: true

  - type: textarea
    id: problem_statement
    attributes:
      label: Problem Statement / Motivation
      description: Is your feature request related to a problem or limitation? Please describe.
      placeholder: e.g., I'm always frustrated when I need to manually transfer eBooks from my Calibre server via USB...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: e.g., Add an OPDS server entry screen in Settings where users can input server URL, auth credentials, and browse/download books.
    validations:
      required: true

  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: e.g., Using third-party sync apps or cloud storage folders.

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Visual Concepts
      description: Drag & drop any UI sketches, mockups, or inspiration screenshots here if applicable.

  - type: checkboxes
    id: participation
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help test this feature once implemented.
        - label: I would be interested in submitting a Pull Request for this feature.
