name: readaway_workspace
repository: https://github.com/DrkXo/readaway

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

workspace:
  - apps/readaway
  - packages/readaway_core
  - packages/vscode_theme_parser

dev_dependencies:
  melos: ^8.0.0
  code_assets: ^2.0.0
  hooks: ^2.0.2

dependency_overrides:
  cli_util: ^0.5.0

melos:
  ide:
    intellij:
      enabled: true
      generateAppRunConfigs: true
      executeInTerminal: false

  sdkPath: .fvm/flutter_sdk

  command:
    version:
      # Link commits and PRs to the GitHub repository in generated CHANGELOG.md
      linkToCommits: true
      # Print GitHub Release draft creation URLs after versioning
      releaseUrl: true
      # Update dependency version constraints of packages in the workspace
      updateGitTagRefs: true
      # Generate a root CHANGELOG.md aggregating changes across all packages
      workspaceChangelog: true
      # Include scopes in changelog entries (e.g., - **app**: commit message)
      includeScopes: true
      # Include commit SHAs in changelog entries
      includeCommitId: true

      hooks:
        preCommit: bash scripts/check_branch.sh

  categories:
    app:
      - "apps/**"
    packages:
      - "packages/**"

  packages:
    - apps/*
    - packages/*

  scripts:
    analyze:
      run: melos exec --depends-on="flutter" -- dart analyze --fatal-infos
      description: Run dart analyze in all packages

    format:
      run: melos exec --depends-on="flutter" -- dart format --set-exit-if-changed .
      description: Check formatting in all packages

    codegen:
      description: Run codegen in all apps
      run: melos exec --depends-on="build_runner" -- "fvm dart run build_runner build"

    refresh:
      description: Refresh Apps & Packages Deps
      steps:
        - melos exec --flutter -- "fvm exec flutter clean"
        - melos exec --flutter -- "fvm exec flutter pub get"

    # -------------------------------------------------------------
    # Dependency & Launcher Updates
    # -------------------------------------------------------------
    upgrade:deps:
      run: melos exec -c 1 --flutter -- "fvm exec flutter pub upgrade"
      description: Upgrade dependencies across all Flutter apps and packages

    upgrade:deps:major:
      run: melos exec -c 1 --flutter -- "fvm exec flutter pub upgrade --major-versions"
      description: Upgrade dependencies[major] across all Flutter apps and packages

    update:launcher_icon:
      run: melos exec -c 1 --depends-on="flutter_launcher_icons" -- "fvm exec dart run flutter_launcher_icons"
      description: Update launcher icons

    # -------------------------------------------------------------
    # Versioning & Release Reference (Native Melos CLI)
    # -------------------------------------------------------------
    # Melos handles versioning natively via `melos version`. Useful commands:
    #
    # • Workspace (All Packages + App):
    #   fvm dart run melos version --all
    #   fvm dart run melos version --all --prerelease --preid=beta
    #   fvm dart run melos version --all --graduate
    #
    # • App Only (readaway):
    #   fvm dart run melos version --category="app" --all
    #   fvm dart run melos version --category="app" --all --prerelease --preid=beta
    #   fvm dart run melos version --category="app" --all --graduate
    #
    # • Packages Only (readaway_core, vscode_theme_parser):
    #   fvm dart run melos version --category="packages"
    #   fvm dart run melos version --category="packages" --prerelease --preid=beta
    #   fvm dart run melos version --category="packages" --graduate
    #
    # • Manual Specific Version:
    #   fvm dart run melos version -V readaway:1.1.0 -V readaway_core:0.2.0

    # -------------------------------------------------------------
    # Build Scripts
    # -------------------------------------------------------------
    build:apk:debug:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build apk --debug"
      description: Build debug APK for ReadAway app

    build:apk:release:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build apk --release"
      description: Build release APK for ReadAway app

    build:apk:split:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build apk --release --split-per-abi"
      description: Build release APK split per ABI (armeabi-v7a, arm64-v8a, x86_64)

    build:linux:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build linux --release"
      description: Build Linux binary and clean workspace for ReadAway app

    build:linux:appimage:
      run: melos exec -c 1 --category="app" -- "appimage-builder --recipe AppImageBuilder.yml"
      description: Build Linux AppImage for ReadAway app

    # -------------------------------------------------------------
    # Test Scripts
    # -------------------------------------------------------------
    test:
      run: melos exec --dir-exists="test" --fail-fast -- "fvm exec flutter test --no-pub --coverage"
      description: Run Flutter tests for a specific package in this project.
      select-package:
        flutter: true
        dir-exists: test
    test:coverage:
      run: melos exec --dir-exists="test" --fail-fast -- "fvm exec flutter test --no-pub"
      description: Run Flutter tests for a specific package in this project.
      select-package:
        flutter: true
        dir-exists: test
