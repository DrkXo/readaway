name: readaway_workspace
repository: https://github.com/DrkXo/readaway

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

workspace:
  - apps/readaway
  - packages/readaway_core
  - packages/vscode_theme_parser

dev_dependencies:
  melos: ^8.0.0
  code_assets: ^2.0.0
  hooks: ^2.0.2

dependency_overrides:
  cli_util: ^0.5.0
  # Point at the in-tree DrkXo/hyper_render submodule, which adds
  # RenderHyperBox.debugLineFragments() — the per-line fragments that actually
  # got positioned. The submodule is pinned by gitlink to the same commit that
  # pub.git used before, so this is a source-location swap, not a version bump.
  #
  # Why a submodule: edits inside packages/hyper_render are picked up by the
  # app on the next hot restart with no `pub get`, and `git submodule status`
  # / a second `git diff` inside the checkout makes local fork changes
  # reviewable. Melos never sees it (it is absent from the `workspace:` list
  # below), so it is never versioned or published as a first-party package.
  #
  # hyper_render_core MUST be overridden too, and this is not optional:
  # `hyper_render` reaches core through its own
  # `dependency_overrides: hyper_render_core: path: packages/hyper_render_core`.
  # Pub only honours overrides from the root package of a resolution, so that
  # nested path is discarded and core would resolve from pub.dev — the build
  # would succeed and the added methods would simply be missing at runtime.
  #
  # Requires `git submodule update --init --recursive` after cloning.
  hyper_render:
    path: packages/hyper_render
  hyper_render_core:
    path: packages/hyper_render/packages/hyper_render_core

melos:
  ide:
    intellij:
      enabled: true
      generateAppRunConfigs: true
      executeInTerminal: false

  sdkPath: .fvm/flutter_sdk

  command:
    bootstrap:
      hooks:
        post: bash scripts/setup_hooks.sh

    version:
      # Link commits and PRs to the GitHub repository in generated CHANGELOG.md
      linkToCommits: true
      # Print GitHub Release draft creation URLs after versioning
      releaseUrl: true
      # Update dependency version constraints of packages in the workspace
      updateGitTagRefs: true
      # Generate a root CHANGELOG.md aggregating changes across all packages
      workspaceChangelog: true
      # Include scopes in changelog entries (e.g., - **app**: commit message)
      includeScopes: true
      # Include commit SHAs in changelog entries
      includeCommitId: true

      hooks:
        preCommit: bash scripts/check_branch.sh

  categories:
    app:
      - "apps/**"
    packages:
      - "packages/**"

  packages:
    - apps/*
    - packages/*

  # NOTE: the `packages:` globs above are legacy. Melos 8 derives its package
  # list exclusively from the pub `workspace:` list at the top of this file —
  # verified against melos 8.6.0, which never reads `melos.packages`. Adding a
  # directory to this glob alone does not make melos aware of it.
  #
  # `packages/hyper_render` is the DrkXo/hyper_render fork, checked out as a
  # git submodule. What actually keeps melos out is that it is deliberately
  # absent from the `workspace:` list above — do not add it. If melos ever
  # treated it as a first-party workspace package, `melos version` would bump
  # its version and commit *inside* the submodule (an unpushed commit that
  # breaks CI's submodule checkout), `melos publish` would try to publish the
  # fork to pub.dev, and `melos exec -- dart analyze` would lint a third-party
  # codebase.
  #
  # The `ignore:` below is a redundant safety net for that invariant. Note that
  # melos privacy is driven solely by `publish_to: none` in a package's own
  # pubspec, which is not an option here: that file lives in the submodule, so
  # editing it would leave the checkout permanently dirty.
  #
  # Consequence: `melos exec` will not run this package's tests. Run them
  # directly with `cd packages/hyper_render && fvm flutter test`.
  ignore:
    - packages/hyper_render

  scripts:
    setup:hooks:
      run: bash scripts/setup_hooks.sh
      description: Configure local Git hooks in .githooks directory

    analyze:
      run: melos exec -- dart analyze --fatal-infos
      description: Run dart analyze in all packages

    format:
      run: melos exec -- dart format --set-exit-if-changed .
      description: Check formatting in all packages

    codegen:
      description: Run codegen in all apps and packages
      run: melos exec --depends-on="build_runner" -- "fvm dart run build_runner build --delete-conflicting-outputs"

    refresh:
      description: Refresh Apps & Packages Deps
      steps:
        - melos exec --flutter -- "fvm exec flutter clean"
        - melos exec --flutter -- "fvm exec flutter pub get"

    # -------------------------------------------------------------
    # Dependency & Launcher Updates
    # -------------------------------------------------------------
    upgrade:deps:
      run: melos exec -c 1 --flutter -- "fvm exec flutter pub upgrade"
      description: Upgrade dependencies across all Flutter apps and packages

    upgrade:deps:major:
      run: melos exec -c 1 --flutter -- "fvm exec flutter pub upgrade --major-versions"
      description: Upgrade dependencies[major] across all Flutter apps and packages

    update:launcher_icon:
      run: melos exec -c 1 --depends-on="flutter_launcher_icons" -- "fvm exec dart run flutter_launcher_icons"
      description: Update launcher icons

    # -------------------------------------------------------------
    # Versioning & Release Reference (Native Melos CLI)
    # -------------------------------------------------------------
    # Melos handles versioning natively via `melos version`. Useful commands:
    #
    # • Workspace (All Packages + App):
    #   fvm dart run melos version --all
    #   fvm dart run melos version --all --prerelease --preid=beta
    #   fvm dart run melos version --all --graduate
    #
    # • App Only (readaway):
    #   fvm dart run melos version --category="app" --all
    #   fvm dart run melos version --category="app" --all --prerelease --preid=beta
    #   fvm dart run melos version --category="app" --all --graduate
    #
    # • Packages Only (readaway_core, vscode_theme_parser):
    #   fvm dart run melos version --category="packages"
    #   fvm dart run melos version --category="packages" --prerelease --preid=beta
    #   fvm dart run melos version --category="packages" --graduate
    #
    # • Manual Specific Version:
    #   fvm dart run melos version -V readaway:1.1.0 -V readaway_core:0.2.0

    # -------------------------------------------------------------
    # Build Scripts
    # -------------------------------------------------------------
    build:apk:debug:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build apk --debug"
      description: Build debug APK for Readaway app

    build:apk:release:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build apk --release"
      description: Build release APK for Readaway app

    build:apk:split:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build apk --release --split-per-abi"
      description: Build release APK split per ABI (armeabi-v7a, arm64-v8a, x86_64)

    build:linux:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build linux --release"
      description: Build Linux binary and clean workspace for Readaway app

    build:linux:appimage:
      run: bash scripts/package_linux.sh
      description: Build Linux AppImage & tarball for Readaway app

    # -------------------------------------------------------------
    # Packaging & Release Artifact Scripts
    # -------------------------------------------------------------
    package:android:
      run: bash scripts/package_android.sh
      description: Collect, rename, and package all Android release APKs

    package:linux:appimage:
      run: bash scripts/package_linux.sh
      description: Package Linux bundle into tar.gz and AppImage

    package:linux:deb:
      run: bash scripts/package_deb_rpm.sh "" "" deb
      description: Package Linux bundle into Debian (.deb) package

    package:linux:rpm:
      run: bash scripts/package_deb_rpm.sh "" "" rpm
      description: Package Linux bundle into Red Hat (.rpm) package

    package:linux:
      steps:
        - melos run package:linux:appimage
        - melos run package:linux:deb
        - melos run package:linux:rpm
      description: Package Linux bundle into tar.gz, AppImage, deb, and rpm

    package:checksums:
      run: bash scripts/generate_checksums.sh
      description: Generate SHA-256 checksums for all release binaries

    package:all:
      steps:
        - melos run package:android
        - melos run package:linux
        - melos run package:checksums
      description: Package all Android and Linux artifacts and generate checksums

    # -------------------------------------------------------------
    # Test Scripts
    # -------------------------------------------------------------
    test:
      run: melos exec --dir-exists="test" --fail-fast -- "fvm exec flutter test --no-pub"
      description: Run tests in packages with a test directory

    test:coverage:
      run: melos exec --dir-exists="test" --fail-fast -- "fvm exec flutter test --no-pub --coverage"
      description: Run tests with coverage in packages with a test directory
