name: readaway_workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

workspace:
  - apps/readaway
  - packages/readaway_core
  - packages/readaway_core_rust

dev_dependencies:
  melos: ^8.0.0
  logging: ^1.2.0
  code_assets: ^2.0.0
  hooks: ^2.0.2

dependency_overrides:
  cli_util: ^0.5.0

melos:
  ide:
    intellij:
      enabled: true
      generateAppRunConfigs: true
      executeInTerminal: false

  sdkPath: .fvm/flutter_sdk

  categories:
    app:
      - "apps/**"
    packages:
      - "packages/**"

  packages:
    - apps/*
    - packages/*

  scripts:
    analyze:
      run: melos exec --depends-on="flutter" -- dart analyze --fatal-infos
      description: Run dart analyze in all packages

    format:
      run: melos exec --depends-on="flutter" -- dart format --set-exit-if-changed .
      description: Check formatting in all packages

    codegen:
      run: melos exec -c 1 --depends-on="build_runner" -- "fvm dart run build_runner build"
      description: Run codegen in all apps

    refresh:
      run: melos exec -c 1 --flutter -- "flutter clean && flutter pub get"
      description: Refresh Apps & Packages Deps

    # -------------------------------------------------------------
    # Dependency & Launcher Updates
    # -------------------------------------------------------------
    upgrade:deps:
      run: melos exec -c 1 --flutter -- "fvm exec flutter pub upgrade"
      description: Upgrade dependencies across all Flutter apps and packages

    upgrade:deps:major:
      run: melos exec -c 1 --flutter -- "fvm exec flutter pub upgrade --major-versions"
      description: Upgrade dependencies[major] across all Flutter apps and packages

    update:launcher_icon:
      run: melos exec -c 1 --depends-on="flutter_launcher_icons" -- "fvm exec dart run flutter_launcher_icons"
      description: Update launcher icons

    # -------------------------------------------------------------
    # Build Scripts
    # -------------------------------------------------------------
    build:apk:debug:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build apk --debug"
      description: Build debug APK for ReadAway app

    build:apk:release:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build apk --release"
      description: Build release APK for ReadAway app

    build:apk:split:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build apk --release --split-per-abi"
      description: Build release APK split per ABI (armeabi-v7a, arm64-v8a, x86_64)

    build:linux:
      run: melos exec -c 1 --category="app" -- "fvm exec flutter build linux --release"
      description: Build Linux binary and clean workspace for ReadAway app

    build:linux:appimage:
      run: melos exec -c 1 --category="app" -- "appimage-builder --recipe AppImageBuilder.yml"
      description: Build Linux AppImage for ReadAway app

    # -------------------------------------------------------------
    # Test Scripts
    # -------------------------------------------------------------
    test:scoped:
      run: melos exec --dir-exists="test" --fail-fast -- "fvm exec flutter test --no-pub --coverage"
      description: Run Flutter tests for a specific package in this project.
      select-package:
        flutter: true
        dir-exists: test
