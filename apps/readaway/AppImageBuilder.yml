version: 1
script:
  - rm -rf AppDir || true
  - cp -r build/linux/x64/release/bundle AppDir
  - mkdir -p AppDir/usr/share/icons/hicolor/64x64/apps/
AppDir:
  path: /home/drkxo/Documents/Projects/playground/readaway/apps/readaway/AppDir
  app_info:
    id: dev.readaway
    name: Readaway
    icon: application-vnd.appimage
    version: latest
    exec: Readaway
    exec_args: $@
  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*
AppImage:
  arch: x86_64
  update-information: guess
