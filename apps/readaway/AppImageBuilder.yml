version: 1
script:
  - rm -rf AppDir || true
  - cp -r build/linux/x64/release/bundle AppDir
  - cp linux/dev.readaway.desktop AppDir/dev.readaway.desktop
  - mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps/
  - cp assets/logo/foreground.png AppDir/usr/share/icons/hicolor/256x256/apps/readaway.png
  - cp assets/logo/foreground.png AppDir/readaway.png
  - cp assets/logo/foreground.png AppDir/.DirIcon
AppDir:
  path: ./AppDir
  app_info:
    id: dev.readaway
    name: Readaway
    icon: readaway
    version: latest
    exec: Readaway
    exec_args: "$@"
  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*
AppImage:
  arch: x86_64
  update-information: guess
