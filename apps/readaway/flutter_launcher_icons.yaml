flutter_launcher_icons:
  # Global icon image
  image_path: "assets/logo/foreground.png"

  # Android Configuration
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#272724"
  adaptive_icon_foreground: "assets/logo/foreground.png"
  adaptive_icon_monochrome: "assets/logo/foreground.png"
  adaptive_icon_foreground_inset: 16

  # iOS Configuration
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#272724"
  image_path_ios_dark_transparent: "assets/logo/foreground.png"
  image_path_ios_tinted_grayscale: "assets/logo/foreground.png"
  desaturate_tinted_to_grayscale_ios: true

  # Web Configuration
  web:
    generate: true
    image_path: "assets/logo/foreground.png"
    background_color: "#272724"
    theme_color: "#272724"

  # Windows Configuration
  windows:
    generate: true
    image_path: "assets/logo/foreground.png"
    icon_size: 48

  # macOS Configuration
  macos:
    generate: true
    image_path: "assets/logo/foreground.png"
