targets:
  $default:
    builders:
      json_serializable:
        options:
          explicit_to_json: true
      drift_dev:
        options:
          # Store DateTime columns as ISO-8601 text so ordering is exact and
          # sub-second timestamps survive (the app sorts the library by
          # lastOpened and annotations by updatedAt).
          store_date_time_values_as_text: true
